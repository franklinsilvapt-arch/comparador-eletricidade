name: Sonda fontes (temporario)
on:
  push:
    paths: [".github/workflows/sonda-fontes.yml", "comparador-eletricidade/scripts/sonda_fontes.py"]
  workflow_dispatch:
jobs:
  sonda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python3 comparador-eletricidade/scripts/sonda_fontes.py
